name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # weekly: catch breakage from new HA / HACS releases

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      # HACS only supports public repositories, and its validator can't read
      # a private repo's files ("expected a dictionary. Got None"). Skip it
      # until the repo is public rather than failing every run.
      - id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api "repos/${{ github.repository }}" --jq .private)" >> "$GITHUB_OUTPUT"
      - if: steps.visibility.outputs.private == 'true'
        run: echo "::notice::Skipping HACS validation - HACS only supports public repositories."
      - if: steps.visibility.outputs.private != 'true'
        uses: hacs/action@main
        with:
          category: integration
          # Brand images ship in custom_components/geopulse/brand/, which
          # HA serves locally; there's no home-assistant/brands entry.
          ignore: brands

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-test.txt
      - run: pytest -q
